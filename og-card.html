<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:'Inter',-apple-system,sans-serif;background:#ffffff;position:relative;color:#2c3e50}
.glow{position:absolute;right:-200px;top:-260px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,rgba(36,184,209,.16) 0%,rgba(36,184,209,0) 68%)}
.bar{position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(90deg,#24B8D1,#5fd4e8,#24B8D1)}
.wrap{position:absolute;left:80px;top:96px;right:80px}
.logo{width:560px;display:block}
h1{margin:44px 0 0;font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:#424242}
h1 span{color:#24B8D1}
p{margin:18px 0 0;font-size:24px;font-weight:500;color:#64748b;max-width:900px;line-height:1.45}
.brands{position:absolute;left:80px;right:80px;bottom:56px;display:flex;align-items:center;gap:28px}
.brands .lbl{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#64748b;margin-right:8px}
.chip{height:76px;padding:0 26px;border-radius:16px;background:#f8f9fa;border:1px solid #e1e4e8;display:flex;align-items:center}
.chip img{height:40px;width:auto;display:block}
.chip.sq{padding:0 16px}.chip.sq img{height:52px;border-radius:12px}
.chip.dark{background:#2c2c2c;border-color:#2c2c2c}.chip.dark img{height:54px}
.url{position:absolute;right:80px;top:110px;font-size:22px;font-weight:700;color:#24B8D1;letter-spacing:-.01em}
</style></head><body>
<div class="bar"></div><div class="glow"></div>
<div class="url">packetpipe.com</div>
<div class="wrap">
  <img class="logo" src="packetpipe_logo.svg" alt="Packetpipe">
  <h1>Engineering Excellence, <span>Delivered</span></h1>
  <p>Software development, radio playout &amp; broadcasting, ticketing, AV and equipment hire, electronics R&amp;D and IT infrastructure.</p>
</div>
<div class="brands">
  <div class="lbl">Our brands</div>
  <div class="chip"><img src="logo_radeeo.png" alt="Radeeo"></div>
  <div class="chip sq"><img src="logo_pumpradio.png" alt="Pump Radio"></div>
  <div class="chip"><img src="logo_ticketbaron.png" alt="TicketBaron"></div>
  <div class="chip dark"><img src="logo_kv2.png" alt="KV2 Audio"></div>
</div>
</body></html>
