# NGINX Configuration for packetpipe.com
# Place this file in /etc/nginx/sites-available/packetpipe.com
# Then symlink: sudo ln -s /etc/nginx/sites-available/packetpipe.com /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 85.10.207.197:80;
    listen [::]:80;
    server_name packetpipe.com www.packetpipe.com;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/packetpipe.com;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 85.10.207.197:443 ssl http2;
    listen [::]:443 ssl http2;
    server_name packetpipe.com www.packetpipe.com;

    # SSL Certificate paths (certbot will manage these)
    ssl_certificate /etc/letsencrypt/live/packetpipe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packetpipe.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/packetpipe.com/chain.pem;

    # Modern SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory for your static site
    root /var/www/packetpipe.com;
    index index.html;

    # Let's Encrypt ACME challenge (needed for renewals over HTTPS)
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/packetpipe.com;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Main location block
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to hidden files EXCEPT .well-known
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype image/svg+xml;

    # Logging
    access_log /var/log/nginx/packetpipe.com.access.log;
    error_log /var/log/nginx/packetpipe.com.error.log;
}
